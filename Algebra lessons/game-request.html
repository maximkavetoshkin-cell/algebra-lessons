<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Game</title>
    <style>
        body {
    background-color: #0f0f0f;
    margin: 0;
    padding: 20px;
}

.request-form-container {
    background-color: #1a1a1a;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 25px;
    max-width: 500px;
    margin: 20px auto;
    font-family: sans-serif;
    color: #fff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

.request-form-container h2 {
    margin-top: 0;
    color: #ba73e0;
    text-align: center;
}

.request-form-container p {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input, 
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #444;
    background-color: #2a2a2a;
    color: #fff;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

.form-group textarea {
    height: 80px;
    resize: vertical;
}

.form-group input:focus, 
.form-group textarea:focus {
    border-color: #a516f1;
    outline: none;
}

.submit-btn {
    width: 100%;
    background-color: #a516f1;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
}

.submit-btn:hover {
    background-color: #a516f1;
}


    </style>
</head>
<body>
    <div class="request-form-container">
        <h2>Request a Game! </h2>
        <p>Let me know what game you want to see added next.</p>
        
        <form action="https://formspree.io/f/xyeekyag" method="POST" class="game-request-form">
            <div class="form-group">
                <label for="username">Your Name / Nickname:</label>
                <input type="text" id="username" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="gametitle">Game Title:</label>
                <input type="text" id="gametitle" name="requested_game" placeholder="e.g., Tetris, Retro Bowl" required>
            </div>

            <div class="form-group">
                <label for="details">Additional Details (Optional):</label>
                <textarea id="details" name="message" placeholder="Any specific version or unblocked link?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
    </div>

<script>
    document.getElementById("requestForm").addEventListener("submit", function(event) {
        // 1. Let the browser send the data to Formspree in the background
        
        // 2. Pop up a quick alert window immediately
        alert("Thanks for submitting! Bringing you back to the main page...");
        
        // 3. Wait 3 seconds, then drop back to the main homepage
        setTimeout(function() {
            window.top.location.href = "index.html";
        }, 3000);
    });
</script>
</body>
</html>
