<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">  
<title>Algebra Lessons out games</title>
<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  /* ========== BODY ========== */
  body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #050510, #000);
    color: white;
    display: flex;
    flex-direction: column;
  }

  /* ========== TOP NAV BAR ========== */
  .navbar {
    width: 100%;
    padding: 0 40px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, #0a0a2a, #07071f);
    box-shadow:
      0 4px 20px rgba(255, 16, 240, 0.5),
      0 2px 8px rgba(0, 0, 0, 0.9);
    border-bottom: 2px solid #FF10F0;
    position: sticky;
    top: 0;
    z-index: 999;
  }

  .navbar-title {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px #FF10F0,
      0 0 30px #FF10F0;
  }

  .navbar-links {
    display: flex;
    gap: 14px;
  }

  .nav-btn {
    padding: 10px 22px;
    font-size: clamp(13px, 1.8vw, 16px);
    color: white;
    background: transparent;
    border: 2px solid #FF10F0;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    box-shadow:
      0 0 5px #FF10F0,
      0 0 10px #FF10F0;
    transition: background 0.3s, box-shadow 0.3s, color 0.3s;
  }

  .nav-btn:hover {
    background: #FF10F0;
    color: black;
    box-shadow:
      0 0 10px #FF10F0,
      0 0 25px #FF10F0,
      0 0 45px #FF10F0;
  }

  /* ========== PAGE CONTENT ========== */
  .page-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 30px 50px 30px;
  }

  /* ========== BUTTON GRID ========== */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 30px;
    width: 100%;
    max-width: 1200px;
    justify-items: center;
  }

  /* ========== GAME BUTTONS ========== */
  .btn {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    min-height: 220px;
    padding: 0;
    font-weight: bold;
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    text-align: center;
    color: white;
    background: rgba(255, 16, 240, 0.04);
    border: 2px solid #FF10F0;
    box-shadow:
      0 0 6px #FF10F0,
      0 0 12px #FF10F0;
    transition:
      background 0.3s,
      box-shadow 0.3s,
      transform 0.15s;
    overflow: hidden;
  }

  /* ========== AUTO-SCALING IMAGES ========== */
  .btn img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
    pointer-events: none;
    transition: transform 0.35s ease;
  }

  /* Label overlay on image */
  .btn span {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    letter-spacing: 0.6px;
    background: rgba(0, 0, 0, 0.75);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn:hover {
    background: rgba(255, 16, 240, 0.18);
    box-shadow:
      0 0 14px #FF10F0,
      0 0 30px #FF10F0,
      0 0 55px #FF10F0;
    transform: translateY(-5px);
  }

  .btn:hover img {
    transform: scale(1.06);
  }

  .btn:active {
    transform: scale(0.98);
  }

  /* ========== GAME OVERLAY ========== */
  #gameOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  #gameFrame {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ========== EXIT HOVER ZONE ========== */
  #exitHoverZone {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 65px;
    z-index: 10000;
    pointer-events: none;
  }

  #closeBtn {
    position: absolute;
    top: 12px;
    right: 20px;
    padding: 10px 18px;
    background: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  #exitHoverZone:hover #closeBtn {
    opacity: 1;
    pointer-events: auto;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {

    .btn-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 22px;
    }

    .navbar {
      padding: 0 18px;
      height: 70px;
    }

    .btn {
      min-height: 190px;
    }
  }

  @media (max-width: 480px) {

    .btn-grid {
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .page-content {
      padding: 24px 16px 36px 16px;
    }

    .navbar-title {
      letter-spacing: 1px;
    }

    .nav-btn {
      padding: 8px 12px;
    }

    .btn {
      min-height: 170px;
    }
  }

</style>
</head>
<body>

<!-- ========== TOP NAV BAR ========== -->
<nav class="navbar">
  <span class="navbar-title">Algebra Lessons</span>
  <div class="navbar-links">
    <a href="https://maximkavetoshkin-cell.github.io/algebra-lessons/Algebra%20lessons/" class="nav-btn">Home</a>
    <a href="https://maximkavetoshkin-cell.github.io/algebra-lessons/Algebra%20lessons/our%20games.html" class="nav-btn">Our Games</a>
  </div>
</nav>

<!-- ========== PAGE CONTENT ========== -->
<div class="page-content">
  <div class="btn-grid">

    <button class="btn"
      onclick="loadGame('our games/cookie clicker.html')">
      <img src="photos_algebra_lessons/cookie_clicker.jpg" alt="Cookie Clicker">
      <span>Cookie Clicker</span>
    </button>

    <button class="btn"
      onclick="loadGame('our games/penalty_kicks.html')">
      <img src="photos_algebra_lessons/penalty_kicks.jpg" alt="penalty kicks">
      <span>Penalty Kicks</span>
    </button>
    <button class="btn"
      onclick="loadGame('our games/speed _slope.html')">
      <img src="photos_algebra_lessons/speed slope.jpg" alt="Speed Slope">
      <span>Speed Slope</span>
    </button>

>
</div>

<!-- ========== GAME OVERLAY ========== -->
<div id="gameOverlay">
  <iframe id="gameFrame"></iframe>
</div>

<!-- ========== EXIT HOVER ZONE ========== -->
<div id="exitHoverZone">
  <button id="closeBtn" onclick="closeGame()">✖ Close</button>
</div>

<script>

  const overlay   = document.getElementById('gameOverlay');
  const gameFrame = document.getElementById('gameFrame');
  const exitZone  = document.getElementById('exitHoverZone');

  function loadGame(url) {
    gameFrame.src = url;
    overlay.style.display = 'flex';
    exitZone.style.pointerEvents = 'auto';
  }

  function closeGame() {
    gameFrame.src = '';
    overlay.style.display = 'none';
    exitZone.style.pointerEvents = 'none';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeGame();
  });

</script>
</body>
</html>
