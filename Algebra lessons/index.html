<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">  
<title>Algebra Lessons</title>
<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  /* ========== BODY ========== */
  body {
    min-height: 100vh;
    background: radial-gradient(circle at center, #050510, #000);
    color: white;
    display: flex;
    flex-direction: column;
  }

  /* ========== TOP NAV BAR ========== */
  .navbar {
    width: 100%;
    padding: 0 40px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, #0a0a2a, #07071f);
    box-shadow:
      0 4px 20px rgba(255, 16, 240, 0.5),
      0 2px 8px rgba(0, 0, 0, 0.9);
    border-bottom: 2px solid #FF10F0;
    position: sticky;
    top: 0;
    z-index: 999;
  }

  .navbar-title {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 5px #fff,
      0 0 10px #fff,
      0 0 20px #FF10F0,
      0 0 30px #FF10F0;
  }

  .navbar-links {
    display: flex;
    gap: 14px;
  }

  .nav-btn {
    padding: 10px 22px;
    font-size: clamp(13px, 1.8vw, 16px);
    color: white;
    background: transparent;
    border: 2px solid #FF10F0;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    box-shadow:
      0 0 5px #FF10F0,
      0 0 10px #FF10F0;
    transition: background 0.3s, box-shadow 0.3s, color 0.3s;
  }

  .nav-btn:hover {
    background: #FF10F0;
    color: black;
    box-shadow:
      0 0 10px #FF10F0,
      0 0 25px #FF10F0,
      0 0 45px #FF10F0;
  }

  /* ========== PAGE CONTENT ========== */
  .page-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 30px 50px 30px;
  }

  /* ========== BUTTON GRID ========== */
  .btn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 30px;
    width: 100%;
    max-width: 1200px;
  }

  /* ========== GAME BUTTONS ========== */
  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    min-height: 220px;
    padding: 0;
    font-weight: bold;
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    text-align: center;
    color: white;
    background: rgba(255, 16, 240, 0.04);
    border: 2px solid #FF10F0;
    box-shadow:
      0 0 6px #FF10F0,
      0 0 12px #FF10F0;
    transition:
      background 0.3s,
      box-shadow 0.3s,
      transform 0.15s;
    overflow: hidden;
  }

  /* ========== AUTO-SCALING IMAGES ========== */
  .btn img {
    width: 100%;
    height: auto;
    object-fit: contain;
    object-fit: contain; /* shows the whole image */
    object-fit: cover;
    display: block;
    border-bottom: 2px solid #FF10F0;
    pointer-events: none;
    transition: transform 0.35s ease;
  }

  /* Label below image */
  .btn span {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    padding: 12px 8px;
    font-size: clamp(12px, 1.4vw, 16px);
    letter-spacing: 0.6px;
    pointer-events: none;
  }

  .btn:hover {
    background: rgba(255, 16, 240, 0.18);
    box-shadow:
      0 0 14px #FF10F0,
      0 0 30px #FF10F0,
      0 0 55px #FF10F0;
    transform: translateY(-5px);
  }

  .btn:hover img {
    transform: scale(1.06);
  }

  .btn:active {
    transform: scale(0.98);
  }

  /* ========== GAME OVERLAY ========== */
  #gameOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  #gameFrame {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ========== EXIT HOVER ZONE ========== */
  #exitHoverZone {
    position: fixed;
    top: 0;
    right: 0;
    width: 14%;
    height: 65px;
    z-index: 10000;
    pointer-events: none;
  }

  #closeBtn {
    position: absolute;
    top: 12px;
    right: 20px;
    padding: 10px 18px;
    background: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  #exitHoverZone:hover #closeBtn {
    opacity: 1;
    pointer-events: auto;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {

    .btn-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 22px;
    }

    .navbar {
      padding: 0 18px;
      height: 70px;
    }

    .btn {
      min-height: 190px;
    }
  }

  @media (max-width: 480px) {

    .btn-grid {
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .page-content {
      padding: 24px 16px 36px 16px;
    }

    .navbar-title {
      letter-spacing: 1px;
    }

    .nav-btn {
      padding: 8px 12px;
    }

    .btn {
      min-height: 170px;
    }
  }

</style>
</head>
<body>

<!-- ========== TOP NAV BAR ========== -->
<nav class="navbar">
  <span class="navbar-title">Algebra Lessons</span>
  <div class="navbar-links">
    <a href="algebra lesson.html" class="nav-btn">Home</a>
    <a href="algebra lesson our games.html" class="nav-btn">Our Games</a>
  </div>
</nav>

<!-- ========== PAGE CONTENT ========== -->
<div class="page-content">
  <div class="btn-grid">

    <button class="btn"
      onclick="loadGame('https://unblocked-games.s3.amazonaws.com/drift-hunters.html')">
      <img src="photos_algebra_lessons/freeze_nova_blue_guy.jpg" alt="FreezeNova">
      <span>FreezeNova</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://d3rtzzzsiu7gdr.cloudfront.net/library.html')">
      <img src="photos_algebra_lessons/Hypackle.png" alt="Hypackle">
      <span>Hypackle</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://geography-lesson-11.us/#google_vignette')">
      <img src="photos_algebra_lessons/disc.png" alt="GeoLessons">
      <span>GeoLessons</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://math1.life/l')">
      <img src="photos_algebra_lessons/mathlife1.jpg" alt="MathLife1">
      <span>MathLife1</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://escape-road.global.ssl.fastly.net')">
      <img src="photos_algebra_lessons/escape_road.jpeg" alt="Escape Road">
      <span>Escape Road</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://textfree.us/')">
      <img src="https://www.google.com/s2/favicons?sz=128&domain=textfree.us" alt="TextFree">
      <span>TextFree</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://math1.pro/')">
      <img src="photos_algebra_lessons/math_pro.jpg" alt="MathPro">
      <span>MathPro</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://dino-fun.space/')">
      <img src="photos_algebra_lessons/dino_game.jpeg" alt="DinoFun">
      <span>DinoFun</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://math3.lol/index.php#google_vignette')">
      <img src="photos_algebra_lessons/math_index.png" alt="MathIndex">
      <span>MathIndex</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://www.mathgames.com/arcade')">
      <img src="https://www.google.com/s2/favicons?sz=128&domain=mathgames.com" alt="MathGames Arcade">
      <span>MathGames Arcade</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://math3.lol/')">
      <img src="photos_algebra_lessons/mathlol.png" alt="MathLol">
      <span>MathLol</span>
    </button>

    <button class="btn"
      onclick="loadGame('https://www.calculators.org/games/archery/')">
      <img src="photos_algebra_lessons/archery picture.jpg" alt="Archery">
      <span>Archery</span>
    </button>

  </div>
</div>

<!-- ========== GAME OVERLAY ========== -->
<div id="gameOverlay">
  <iframe id="gameFrame"></iframe>
</div>

<!-- ========== EXIT HOVER ZONE ========== -->
<div id="exitHoverZone">
  <button id="closeBtn" onclick="closeGame()">✖ Close</button>
</div>

<script>

  const overlay   = document.getElementById('gameOverlay');
  const gameFrame = document.getElementById('gameFrame');
  const exitZone  = document.getElementById('exitHoverZone');

  function loadGame(url) {
    gameFrame.src = url;
    overlay.style.display = 'flex';
    exitZone.style.pointerEvents = 'auto';
  }

  function closeGame() {
    gameFrame.src = '';
    overlay.style.display = 'none';
    exitZone.style.pointerEvents = 'none';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeGame();
  });

</script>
</body>
</html>
